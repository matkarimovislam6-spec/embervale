<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fdcff;font-family:'Fredoka',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  .hud{position:fixed;z-index:4;pointer-events:none;color:#fff;text-shadow:0 2px 0 rgba(40,20,60,.55),0 0 8px rgba(40,20,60,.35)}

  #stats{top:14px;right:16px;text-align:right;font-size:20px;font-weight:600;line-height:1.5}

  #dialog .name{position:absolute;top:-20px;left:22px;background:#ff8a3d;color:#fff;border:3px solid #3a2450;border-radius:12px;padding:2px 14px;font-weight:700;font-size:17px}

  #overlay kbd{background:#fff;color:#3a2450;border-radius:6px;padding:0 7px;font-family:inherit;font-weight:600}
  .bigbtn{font-family:inherit;font-size:24px;font-weight:700;color:#3a2450;background:#ffe36e;border:4px solid #3a2450;border-radius:18px;padding:10px 34px;cursor:pointer;box-shadow:0 6px 0 #3a2450}

  #tZoom{top:156px}

  #loot{position:fixed;z-index:7;left:50%;top:28%;transform:translate(-50%,-10px) scale(.92);background:#fff8ec;color:#3a2450;border:4px solid #e0a800;
    border-radius:20px;padding:12px 26px 14px;text-align:center;opacity:0;transition:all .35s;pointer-events:none;box-shadow:0 8px 0 rgba(58,36,80,.3);max-width:86vw}

  #realmCard.show{opacity:1;transform:translate(-50%,0)}

  #realmCard .rc-name{font-size:clamp(30px,7vw,54px);font-weight:700;text-shadow:0 4px 0 #3a2450,0 0 24px rgba(255,200,140,.6)}
  #flash{position:fixed;inset:0;z-index:9;background:radial-gradient(circle,#ffffff,#bff6ff);opacity:0;pointer-events:none}
  #bossBar{position:fixed;z-index:5;left:50%;top:58px;transform:translateX(-50%);width:min(420px,56vw);text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
  #bossBar.show{opacity:1}
  #bossBar .bn{font-weight:700;font-size:19px;text-shadow:0 2px 0 #3a2450,0 0 10px rgba(0,0,0,.45);margin-bottom:4px}
  #bossBar .bt{height:12px;border-radius:8px;background:rgba(30,16,50,.6);border:2px solid #fff;overflow:hidden;box-shadow:0 3px 0 rgba(58,36,80,.5)}
  #bossBar .bf{height:100%;width:100%;transition:width .2s}
  /* premium pass */
  #grade{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 58%,rgba(46,22,70,.38) 100%),
               linear-gradient(180deg,rgba(255,214,170,.14),rgba(255,214,170,0) 35%,rgba(90,50,140,0) 70%,rgba(90,50,140,.12))}
  #hearts .h,#hearts .hh{text-shadow:none;filter:drop-shadow(0 2px 0 rgba(58,36,80,.85))}
  #hearts .h{background:linear-gradient(180deg,#ffc2cf,#ff3b62 60%,#d61f4a);-webkit-background-clip:text;background-clip:text;color:transparent}
  #stats,#objective{background:rgba(42,24,64,.32);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:6px 14px}
  #objective{top:56px}
  #gearRow{top:102px}
  #overlay{background:radial-gradient(ellipse at 50% 35%,rgba(255,228,190,.15),rgba(42,22,70,.72) 78%)}
  #overlay h1{background:linear-gradient(180deg,#fffbe8 10%,#ffd27a 60%,#ff9f5a);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:none;filter:drop-shadow(0 5px 0 #3a2450) drop-shadow(0 0 26px rgba(255,190,110,.55));letter-spacing:.04em}
  #overlay .orn{color:#ffd27a;font-size:14px;margin-bottom:4px;opacity:.85;text-shadow:0 2px 0 #3a2450}
  #overlay .controls{background:rgba(42,24,64,.45);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #dialog{background:linear-gradient(180deg,#fffaf0,#fff1dc)}
</style>

<script>
window.__showErr = function(msg){
  var o = document.getElementById('overlay'); if(!o) return;
  var d = document.getElementById('errBox');
  if(!d){ d = document.createElement('div'); d.id = 'errBox';
    d.style.cssText = 'margin-top:18px;max-width:90vw;background:#3a2450;color:#ffd0d0;padding:10px 14px;border-radius:12px;font-size:14px;text-align:left;white-space:pre-wrap';
    o.appendChild(d); }
  o.style.display = 'flex'; d.textContent = 'Problem: ' + msg;
};
window.addEventListener('error', function(e){ window.__showErr((e.message || 'unknown error') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
</script>
<script>
window.__boot = function(){
'use strict';
const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

/* ================= Renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = isTouch ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COL = '#f4dfcf';
scene.background = new THREE.Color(FOG_COL);
scene.fog = new THREE.Fog(FOG_COL, 140, 430);
const SUN_DIR = new THREE.Vector3(0.55, 0.42, 0.35).normalize();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
function fitCamera(){ camera.aspect = window.innerWidth/window.innerHeight; camera.fov = camera.aspect < 1 ? 70 : 52; camera.updateProjectionMatrix(); }
fitCamera();
window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); fitCamera(); });

scene.add(new THREE.HemisphereLight('#d6ecff', '#7f68a0', 0.72));
const rimLight = new THREE.DirectionalLight('#b8e0ff', 0.45); rimLight.position.set(-40, 30, -50); scene.add(rimLight);
const sun = new THREE.DirectionalLight('#ffe2b8', 1.15);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, {left:-50, right:50, top:50, bottom:-50, near:1, far:200});
sun.shadow.bias = -0.0006;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);

/* toon shading */
const gm = new THREE.DataTexture(new Uint8Array([92,92,92,255, 135,135,135,255, 178,178,178,255, 220,220,220,255, 255,255,255,255]), 5, 1, THREE.RGBAFormat);
gm.minFilter = gm.magFilter = THREE.NearestFilter; gm.generateMipmaps = false; gm.needsUpdate = true;
const matCache = {};
function toon(color, extra){
  const key = color + (extra ? JSON.stringify(extra) : '');
  if(!extra && matCache[key]) return matCache[key];
  const m = new THREE.MeshToonMaterial(Object.assign({color, gradientMap:gm}, extra || {}));
  if(!extra) matCache[key] = m;
  return m;
}
const outlineMat = new THREE.MeshBasicMaterial({color:'#221628', side:THREE.BackSide, transparent:true, opacity:0.55});
function outline(mesh, s){ const o = new THREE.Mesh(mesh.geometry, outlineMat); o.scale.setScalar(s || 1.08); mesh.add(o); return mesh; }
function mesh(geo, mat, cast=true, recv=false){ const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = recv; return m; }

/* soft glow texture */
const GLOW = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.3, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
})();

/* wind sway for grass and leaves */
const windU = {value:0};
function addSway(mat, amt, inst){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uWind = windU;
    sh.vertexShader = 'uniform float uWind;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      ${inst ? 'vec3 wp = vec3(instanceMatrix[3].x, 0.0, instanceMatrix[3].z);' : 'vec3 wp = vec3(modelMatrix[3].x, 0.0, modelMatrix[3].z);'}
      float sw = sin(uWind*1.8 + wp.x*0.35 + wp.z*0.25) + 0.5*sin(uWind*3.1 + wp.x*0.8);
      transformed.x += sw * ${amt.toFixed(3)} * max(position.y, 0.0);
      transformed.z += cos(uWind*1.5 + wp.z*0.3) * ${(amt*0.6).toFixed(3)} * max(position.y, 0.0);`);
  };
  mat.customProgramCacheKey = () => 'sway' + amt + (inst ? 'i' : 'm');
}

/* painted golden-hour sky */
const skyU = {uTop:{value:new THREE.Color('#3f9be0')}, uMid:{value:new THREE.Color('#9fd6f2')}, uHor:{value:new THREE.Color(FOG_COL)}, uSun:{value:SUN_DIR}};
const sky = new THREE.Mesh(new THREE.SphereGeometry(520, 32, 16), new THREE.ShaderMaterial({uniforms:skyU, side:THREE.BackSide, depthWrite:false, fog:false,
  vertexShader:'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader:`uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uHor; uniform vec3 uSun; varying vec3 vD;
  void main(){
    vec3 d = normalize(vD); float h = d.y;
    vec3 c = mix(uHor, uMid, smoothstep(-0.02, 0.2, h)); c = mix(c, uTop, smoothstep(0.2, 0.75, h));
    float s = max(dot(d, normalize(uSun)), 0.0);
    c += vec3(1.0, 0.82, 0.55) * pow(s, 10.0) * 0.45 + vec3(1.0, 0.97, 0.88) * smoothstep(0.9965, 0.9985, s);
    gl_FragColor = vec4(c, 1.0);
  }`}));
sky.frustumCulled = false; sky.renderOrder = -10; scene.add(sky);

/* seeded random */
let seed = 1337;
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a,b) => a + rnd()*(b-a);
const smooth = (a,b,x) => { const t = Math.max(0, Math.min(1, (x-a)/(b-a))); return t*t*(3-2*t); };
const lerp = (a,b,t) => a + (b-a)*t;

/* ================= Terrain ================= */
const POI = {
  village:{x:0, z:12}, hill:{x:42, z:-38}, gate:{x:-58, z:40}, ruins:{x:48, z:42}
};
function H(x,z){
  const d = Math.hypot(x,z)/108;
  const f = 1 - smooth(0.58, 1.0, d);
  let h = 2.6 + Math.sin(x*0.05)*Math.cos(z*0.045)*2.4 + Math.sin(x*0.11+1.3)*Math.sin(z*0.09+0.7)*1.1 + Math.sin((x+z)*0.021)*1.6;
  const dh = Math.hypot(x-POI.hill.x, z-POI.hill.z);
  h += 13*Math.exp(-(dh*dh)/(2*13*13));
  const dg = Math.hypot(x-POI.gate.x, z-POI.gate.z);
  h = lerp(h, 9.5, 1 - smooth(9, 19, dg));
  const dv = Math.hypot(x-POI.village.x, z-POI.village.z);
  h = lerp(h, 2.4, 1 - smooth(13, 24, dv));
  const dr = Math.hypot(x-POI.ruins.x, z-POI.ruins.z);
  h = lerp(h, 3.2, 1 - smooth(8, 15, dr));
  return h*f - 5*(1-f);
}
{
  const geo = new THREE.PlaneGeometry(280, 280, 200, 200);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position, cols = [];
  const cSand = new THREE.Color('#f5dda0'), cG1 = new THREE.Color('#93da62'), cG2 = new THREE.Color('#62b84c'),
        cG3 = new THREE.Color('#4b9c58'), cRock = new THREE.Color('#c4b0a0'), cWet = new THREE.Color('#d2b47e'), tmp = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i), y = H(x,z);
    pos.setY(i, y);
    if(y < 0.1) tmp.copy(cWet);
    else if(y < 0.9) tmp.copy(cSand);
    else if(y < 9.5){ const n = 0.5 + 0.5*Math.sin(x*0.3)*Math.sin(z*0.27); tmp.copy(cG1).lerp(cG2, n*0.8); if(y > 7) tmp.lerp(cG3, (y-7)/2.5); }
    else tmp.copy(cG3).lerp(cRock, Math.min(1, (y-9.5)/3));
    cols.push(tmp.r, tmp.g, tmp.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  { // cliffs on steep slopes + painterly colour variation
    const nrm = geo.attributes.normal, col = geo.attributes.color, cliff = new THREE.Color('#caa58a'), cliff2 = new THREE.Color('#a98fb8'), c = new THREE.Color();
    for(let i=0;i<nrm.count;i++){
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), ny = nrm.getY(i);
      c.setRGB(col.getX(i), col.getY(i), col.getZ(i));
      if(y > 0.9 && ny < 0.84){ const k = Math.min(1, (0.84 - ny)*4); c.lerp(cliff, k); if(ny < 0.7) c.lerp(cliff2, 0.35); }
      const n = Math.sin(x*0.13 + z*0.07)*Math.sin(z*0.11 - x*0.05) + 0.5*Math.sin(x*0.5 + z*0.43);
      c.offsetHSL(n*0.012, n*0.03, n*0.025);
      col.setXYZ(i, c.r, c.g, c.b);
    }
  }
  const t = mesh(geo, new THREE.MeshToonMaterial({color:'#ffffff', vertexColors:true, gradientMap:gm}), false, true);
  scene.add(t);
}
const waterU = {uTime:{value:0}, uFog:{value:new THREE.Color(FOG_COL)}, uFogNear:{value:140}, uFogFar:{value:430}, uSun:{value:SUN_DIR}};
const water = new THREE.Mesh(new THREE.PlaneGeometry(900, 900, 150, 150), new THREE.ShaderMaterial({uniforms:waterU, transparent:true,
  vertexShader:`uniform float uTime; varying vec3 vW; varying float vDist;
  void main(){
    vec4 w = modelMatrix * vec4(position, 1.0);
    w.y += sin(w.x*0.15 + uTime*1.2)*0.08 + cos(w.z*0.12 + uTime*0.9)*0.08;
    vW = w.xyz; vec4 mv = viewMatrix * w; vDist = -mv.z; gl_Position = projectionMatrix * mv;
  }`,
  fragmentShader:`uniform float uTime; uniform vec3 uFog; uniform float uFogNear; uniform float uFogFar; uniform vec3 uSun;
  varying vec3 vW; varying float vDist;
  float H(vec2 p){
    float x = p.x, z = p.y;
    float f = 1.0 - smoothstep(0.58, 1.0, length(p)/108.0);
    float h = 2.6 + sin(x*0.05)*cos(z*0.045)*2.4 + sin(x*0.11+1.3)*sin(z*0.09+0.7)*1.1 + sin((x+z)*0.021)*1.6;
    float dh = length(p - vec2(42.0, -38.0)); h += 13.0*exp(-(dh*dh)/338.0);
    h = mix(h, 9.5, 1.0 - smoothstep(9.0, 19.0, length(p - vec2(-58.0, 40.0))));
    h = mix(h, 2.4, 1.0 - smoothstep(13.0, 24.0, length(p - vec2(0.0, 12.0))));
    h = mix(h, 3.2, 1.0 - smoothstep(8.0, 15.0, length(p - vec2(48.0, 42.0))));
    return h*f - 5.0*(1.0 - f);
  }
  void main(){
    float depth = max(0.0, vW.y - H(vW.xz));

function updateAmbient(dt){
  const px = player.x, pz = player.z;
  for(let i=0;i<MOTES;i++){
    const d = moteD[i]; let x = mPos[i*3], z = mPos[i*3+2], wrapped = false;
    if(x - px > 40){ x -= 80; wrapped = true; } else if(px - x > 40){ x += 80; wrapped = true; }
    if(z - pz > 40){ z -= 80; wrapped = true; } else if(pz - z > 40){ z += 80; wrapped = true; }
    if(wrapped) d.base = Math.max(groundAt(x, z), 0) + rr(0.4, 9);
    x += Math.sin(T*d.sp + d.ph)*dt*0.6; z += Math.cos(T*d.sp*0.8 + d.ph)*dt*0.6;
    mPos[i*3] = x; mPos[i*3+2] = z; mPos[i*3+1] = d.base + Math.sin(T*d.sp*1.3 + d.ph)*0.6;
  }
  mGeo.attributes.position.needsUpdate = true;
  for(const f of fliers){
    const a = T*f.sp + f.ph;
    const x = f.cx + Math.cos(a)*f.r, z = f.cz + Math.sin(a*(f.bird ? 1 : 1.3))*f.r;
    const y = f.bird ? f.h + Math.sin(a*2)*1.5 : Math.max(H(x, z), 0) + f.h + Math.sin(T*3 + f.ph)*0.3;
    f.g.position.set(x, y, z); f.g.rotation.y = f.bird ? -a : -a*1.15;
    const flap = f.bird ? Math.sin(T*6 + f.ph*10)*0.5 : Math.sin(T*20 + f.ph)*1.0;
    f.wL.rotation.z = flap; f.wR.rotation.z = -flap;
  }
  for(const fl of floaters){ fl.g.position.y = fl.y + Math.sin(T*0.4 + fl.ph)*1.5; fl.g.rotation.y += dt*0.02; }
}

function updateCity(dt){

    else { c.g.position.set(CX + c.road - lane, 0, c.t); c.g.rotation.y = c.dir > 0 ? 0 : Math.PI; }

      const dx = player.x - c.g.position.x, dz = player.z - c.g.position.z, d = Math.hypot(dx, dz);
      if(d < 2.7 && player.y < 2.6){
        const k = d || 1; player.kbx = dx/k*13; player.kbz = dz/k*13; player.kbT = 0.22; player.vy = 5; player.grounded = false;
        if(c.honk <= 0){ c.honk = 2; sfx(392, 0.22, 'square', 0.05); setTimeout(() => sfx(392, 0.3, 'square', 0.05), 280); toast('🚗 Beep beep! Watch the road!'); }
      }
    }
  }
  for(const p of peds){
    p.t += p.dir*p.sp*dt; if(Math.abs(p.t) > 95){ p.dir *= -1; p.t = Math.sign(p.t)*95; }
    if(p.axis === 'x'){ p.g.position.set(CX + p.t, 0, p.off); p.g.rotation.y = p.dir > 0 ? Math.PI/2 : -Math.PI/2; }
    else { p.g.position.set(CX + p.off, 0, p.t); p.g.rotation.y = p.dir > 0 ? 0 : Math.PI; }
    const s = Math.sin(T*p.sp*4 + p.ph)*0.6; p.legs[0].rotation.x = s; p.legs[1].rotation.x = -s;
    p.g.position.y = Math.abs(Math.sin(T*p.sp*4 + p.ph))*0.06;
  }
  const ph = T % 14;
  const setTL = (grp, on) => { grp.r.color.set(on === 'r' ? '#ff3b3b' : '#4a1818'); grp.y.color.set(on === 'y' ? '#ffd23a' : '#4a3a10'); grp.g.color.set(on === 'g' ? '#3aff7a' : '#103a20'); };

}

/* ---------- animal AI ---------- */
function roar(a){ a.roar = 1.0; sfx(110, 0.9, 'sawtooth', 0.09, 50); setTimeout(() => sfx(80, 0.7, 'sawtooth', 0.07, 45), 120); toast('🦖 ROOOAAARR!'); }
function updateAnimals(dt){
  for(const a of animals){
    if(a.realm !== curRealm) continue;
    const R = REALMS[a.realm], gf = R.ground;
    const pdx = player.x - a.x, pdz = player.z - a.z, pd = Math.hypot(pdx, pdz);
    let speed = a.sp, tx = a.tx, tz = a.tz;
    a.stun = Math.max(0, a.stun - dt); a.bite = Math.max(0, a.bite - dt); a.roar = Math.max(0, a.roar - dt); a.calm = Math.max(0, a.calm - dt); a.flash = Math.max(0, a.flash - dt);
    a.pause = Math.max(0, a.pause - dt);
    if(a.kind === 'rex'){
      if(a.stun > 0) speed = 0;
      else if(state === 'play' && pd < 30 && a.calm <= 0){
        tx = player.x; tz = player.z; speed = 6.6;
        if(!a.alert){ a.alert = true; roar(a); }
        if(pd < 4.8 && a.bite <= 0){ a.bite = 1.4; a.roar = 0.5; hurt(pdx, pdz, 2); }
      } else a.alert = false;
    }
    const dx = tx - a.x, dz = tz - a.z, dist = Math.hypot(dx, dz);
    if(!a.alert && (dist < 3 || a.pause > 0)){
      if(dist < 3 && a.pause <= 0){
        a.pause = rr(1, 4);
        for(let i=0;i<20;i++){ const nx = rr(-85, 85), nz = rr(-85, 85); if(R.inside(nx, nz) && gf(nx, nz) > 0.3){ a.tx = R.ox + nx; a.tz = nz; break; } }
      }
      speed = 0;
    }
    if(speed > 0 && dist > 0.5){
      const want = Math.atan2(dx, dz); let da = want - a.yaw;
      while(da > Math.PI) da -= Math.PI*2; while(da < -Math.PI) da += Math.PI*2;
      a.yaw += da*Math.min(1, dt*2.5);
      const nx = a.x + Math.sin(a.yaw)*speed*dt, nz = a.z + Math.cos(a.yaw)*speed*dt;
      if(R.inside(nx - R.ox, nz) && gf(nx - R.ox, nz) > -0.5){ a.x = nx; a.z = nz; } else { a.tx = R.ox; a.tz = 0; }
    }
    a.phase += dt*speed*(a.kind === 'brachio' ? 0.45 : a.kind === 'rex' ? 0.55 : 0.9);
    const sw = speed > 0 ? Math.sin(a.phase) : 0;
    if(a.legs.length === 2){ a.legs[0].rotation.x = sw*0.55; a.legs[1].rotation.x = -sw*0.55; }
    else { a.legs[0].rotation.x = a.legs[3].rotation.x = sw*0.45; a.legs[1].rotation.x = a.legs[2].rotation.x = -sw*0.45; }
    a.tail.rotation.y = Math.sin(T*1.5 + a.ph)*0.25;
    if(a.neck) a.neck.rotation.y = Math.sin(T*0.5 + a.ph)*0.2;
    if(a.jaw) a.jaw.rotation.x = a.roar > 0 ? 0.65 : 0.05 + Math.sin(T*2 + a.ph)*0.04;
    if(a.kind === 'rex' && a.stun > 0) a.g.rotation.z = Math.sin(T*6)*0.05; else a.g.rotation.z = 0;
    a.g.position.set(a.x, gf(a.x - R.ox, a.z) + Math.abs(sw)*0.12, a.z); a.g.rotation.y = a.yaw;
    a.mat.emissive.set(a.flash > 0 ? '#ff7070' : '#000000');
    if(state === 'play'){ const m = a.r + 0.5; if(pd < m && pd > 0.001){ player.x = a.x + pdx/pd*m; player.z = a.z + pdz/pd*m; } }
  }
}
function swordVsAnimals(){
  for(const a of animals){
    if(a.realm !== curRealm || a.kind !== 'rex' || a.lastSwing === swingId) continue;
    const dx = a.x - player.x, dz = a.z - player.z, d = Math.hypot(dx, dz);
    if(d < a.r + 2.8 && (dx*Math.sin(player.yaw) + dz*Math.cos(player.yaw))/(d || 1) > 0){

      burst(a.x, player.y + 2, a.z, '#ffffff', 8, 4);
      if(a.hits >= 4){ a.hits = 0; a.stun = 4; a.calm = 10; a.alert = false; a.tx = a.x + dx/(d || 1)*60; a.tz = a.z + dz/(d || 1)*60; toast('🦖 The T-Rex is dazed... run!'); }
    }

}

const PMAX = 800, pGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);
const pIM = new THREE.InstancedMesh(pGeo, new THREE.MeshBasicMaterial({color:'#ffffff'}), PMAX);
pIM.frustumCulled = false; pIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage); pIM.userData.keepCull = true; scene.add(pIM);
const pData = [], _pc = new THREE.Color(), _pd = new THREE.Object3D();
let pNext = 0, pLive = 0;
for(let i=0;i<PMAX;i++){ pData.push({life:1, max:0, x:0, y:0, z:0, vx:0, vy:0, vz:0, dead:true}); _pd.scale.setScalar(0); _pd.updateMatrix(); pIM.setMatrixAt(i, _pd.matrix); pIM.setColorAt(i, _pc.set('#ffffff')); }
function burst(x, y, z, color, n=14, sp=5){
  _pc.set(color);
  for(let i=0;i<n;i++){
    const p = pData[pNext];
    p.x = x; p.y = y; p.z = z; p.vx = (Math.random()*2 - 1)*sp; p.vy = (0.5 + Math.random())*sp; p.vz = (Math.random()*2 - 1)*sp;
    p.life = 0; p.max = 0.5 + Math.random()*0.4; p.dead = false;
    pIM.setColorAt(pNext, _pc); pNext = (pNext + 1) % PMAX;
  }
  pIM.instanceColor.needsUpdate = true;
}
function updateParticles(dt){
  let changed = false;
  for(let i=0;i<PMAX;i++){
    const p = pData[i]; if(p.dead) continue;
    p.life += dt; changed = true;
    if(p.life >= p.max){ p.dead = true; _pd.scale.setScalar(0); _pd.updateMatrix(); pIM.setMatrixAt(i, _pd.matrix); continue; }
    p.vy -= 14*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
    _pd.position.set(p.x, p.y, p.z); _pd.rotation.set(p.life*6, p.life*4, 0); _pd.scale.setScalar(Math.max(0.01, 1 - p.life/p.max)); _pd.updateMatrix(); pIM.setMatrixAt(i, _pd.matrix);
  }
  if(changed) pIM.instanceMatrix.needsUpdate = true;
}

  o.type = type; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  q.material = post.mBright; post.mBright.uniforms.tInput.value = post.rtScene.texture; r.setRenderTarget(post.rtA); r.render(post.scene, post.cam);
  q.material = post.mBlur;
  bu.tInput.value = post.rtA.texture; bu.uDir.value.set(1/post.qs[0], 0); r.setRenderTarget(post.rtB); r.render(post.scene, post.cam);
  bu.tInput.value = post.rtB.texture; bu.uDir.value.set(0, 1/post.qs[1]); r.setRenderTarget(post.rtA); r.render(post.scene, post.cam);
  bu.tInput.value = post.rtA.texture; bu.uDir.value.set(1/post.es[0], 0); r.setRenderTarget(post.rtC); r.render(post.scene, post.cam);
  bu.tInput.value = post.rtC.texture; bu.uDir.value.set(0, 1/post.es[1]); r.setRenderTarget(post.rtD); r.render(post.scene, post.cam);
  cu.tScene.value = post.rtScene.texture; cu.tB1.value = post.rtA.texture; cu.tB2.value = post.rtD.texture; cu.uTime.value = T;
  post.bars += (((state === 'title' || realmCardT > 0) ? 1 : 0) - post.bars)*Math.min(1, dt*3); cu.uBars.value = post.bars;
  _sunV.copy(SUN_DIR).multiplyScalar(400).add(camera.position).project(camera); camera.getWorldDirection(_fwd);
  const vis = _fwd.dot(SUN_DIR) > 0 && Math.abs(_sunV.x) < 1.2 && Math.abs(_sunV.y) < 1.2 ? 1 : 0;
  cu.uSun.value.set((_sunV.x + 1)/2, (_sunV.y + 1)/2); cu.uSunVis.value += (vis - cu.uSunVis.value)*Math.min(1, dt*4);
  q.material = post.mComp; r.setRenderTarget(null); r.render(post.scene, post.cam);
}
function toggleCine(){ post.on = !post.on; toast(post.on ? '🎬 Cinematic on' : '🎬 Cinematic off'); $('tCine').style.opacity = post.on ? 1 : 0.5; }

/* light shafts through the forest */
const shafts = [];
{
  const tex = canvasTex(64, 256, x => {
    const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.6, 'rgba(255,255,255,0.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 256);
    x.globalCompositeOperation = 'destination-in';
    const h = x.createLinearGradient(0, 0, 64, 0); h.addColorStop(0, 'rgba(0,0,0,0)'); h.addColorStop(0.5, 'rgba(0,0,0,1)'); h.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = h; x.fillRect(0, 0, 64, 256);
  });
  const geo = new THREE.PlaneGeometry(1, 1);
  for(let i=0;i<10;i++){
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map:tex, color:'#fff0c8', transparent:true, opacity:0.1, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, fog:false}));
    m.scale.set(rr(2.5, 5), 32, 1); m.frustumCulled = false; scene.add(m);
    shafts.push({m, x:rr(-30, 30), z:rr(-30, 30), ph:rr(0, 6.28)});
  }
}
const _sb = new THREE.Matrix4(), _sr = new THREE.Vector3(), _sf = new THREE.Vector3(), _tc = new THREE.Vector3();
function updateShafts(){
  const show = (curRealm === 0 || curRealm === 2) && state !== 'title';
  for(const s of shafts){
    s.m.visible = show; if(!show) continue;
    if(Math.abs(s.x - player.x) > 32 || Math.abs(s.z - player.z) > 32){ s.x = player.x + rr(-30, 30); s.z = player.z + rr(-30, 30); }
    const gy = groundAt(s.x, s.z);
    s.m.position.set(s.x + SUN_DIR.x*15, gy + SUN_DIR.y*15, s.z + SUN_DIR.z*15);
    _tc.copy(camera.position).sub(s.m.position);
    _sr.crossVectors(SUN_DIR, _tc).normalize(); _sf.crossVectors(_sr, SUN_DIR).normalize();
    _sb.makeBasis(_sr, SUN_DIR, _sf); s.m.quaternion.setFromRotationMatrix(_sb);
    s.m.material.opacity = 0.07 + Math.sin(T*0.4 + s.ph)*0.04;
  }
}

function loop(){
  const raw = clock.getDelta(), dt = Math.min(0.05, raw);
  fpsAcc += raw; fpsN++;
  if(fpsAcc >= 1){
    const fps = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0;
    if(fps < 48 && pxr > 0.85){ setRes(Math.max(0.85, pxr - 0.25)); goodSecs = 0; }
    else if(fps > 57){ if(++goodSecs >= 4 && pxr < PR_MAX){ setRes(Math.min(PR_MAX, pxr + 0.15)); goodSecs = 0; } }
    else goodSecs = 0;
    if(fps < 32 && pxr <= 0.86 && post.on){ post.on = false; toast('🎬 Cinematic effects paused for smoother play'); $('tCine').style.opacity = 0.5; }
  }
  update(dt);
  sky.position.copy(camera.position);
  frameN++;
  if(!isTouch || frameN % 2 === 0) renderer.shadowMap.needsUpdate = true;
  updateShafts();
  if(post.on) renderPost(dt); else renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
hero.g.position.set(player.x, player.y, player.z);
camera.position.set(0, 40, 70);
loop();
};
